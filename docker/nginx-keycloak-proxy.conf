# Keycloak proxy: listen on 6842 inside the container, forward to keycloak:8080.
# Host port is KEYCLOAK_PROXY_PORT (default 6842); map host:6842 in compose.
# Backend uses http://keycloak-proxy:6842 from inside Docker.
#
# Mounted as an nginx template: ${KEYCLOAK_PROXY_PORT} is substituted at start
# (the image only substitutes variables that are set, so $host etc. survive).
# Keycloak builds issuer and endpoint URLs from the forwarded port, so it must be
# the published port for every caller -- browsers on the host and the backend
# inside Docker alike -- or a remapped KEYCLOAK_PROXY_PORT breaks token checks.

server {
    listen 6842;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = / {
        return 302 $scheme://$host:${KEYCLOAK_PROXY_PORT}/admin/;
    }

    location / {
        set $kc_upstream keycloak;
        proxy_pass http://$kc_upstream:8080$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port ${KEYCLOAK_PROXY_PORT};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_temp_file_write_size 256k;
    }
}
